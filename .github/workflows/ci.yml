name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Show dependency versions
        run: |
          python --version
          python -m pip show typer click rich pytest ruff pyyaml
          python -m ragledger.cli --help || true

      - name: Run lint
        run: python -m ruff check src tests

      - name: Run tests
        run: python -m pytest -q

      - name: Run demo workflow
        run: |
          ragledger init
          ragledger register examples/support_kb --name support_kb
          ragledger snapshot support_kb
          ragledger snapshot support_kb
          ragledger list-corpora
          ragledger list-snapshots support_kb
          ragledger diff support_kb:v1 support_kb:v2
          ragledger validate --corpus support_kb:v1 --policy policies/rag_data_policy.yml --fail-on-error
          ragledger manifest --corpus support_kb:v1 --output .ragledger/manifests/support_kb_v1.yml
          ragledger report --html
          test -f .ragledger/manifests/support_kb_v1.yml
          test -f .ragledger/reports/latest.html
