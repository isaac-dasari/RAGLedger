[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragledger"
version = "0.1.0"
description = "Local-first control plane for RAG corpus versioning and eval data provenance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Isaac Dasari" }]
dependencies = [
  "typer>=0.16.0,<1.0.0",
  "click>=8.1.7,<9.0.0",
  "rich>=13.0.0,<15.0.0",
  "pyyaml>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "ruff>=0.5.0,<1.0.0",
]

[project.scripts]
ragledger = "ragledger.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
